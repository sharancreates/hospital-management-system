{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin.css') }}">
{% block page_css %}{% endblock %}
{% endblock %}

{% block content %}
<div class="admin-layout">
    <aside class="admin-sidebar">
        <nav class="sidebar-nav">
            <a href="{{ url_for('admin.admin_dashboard') }}"
                class="nav-item {% if request.endpoint == 'admin.admin_dashboard' %}active{% endif %}">
                Dashboard
            </a>
            <a href="{{ url_for('admin.add_doctor') }}"
                class="nav-item {% if request.endpoint == 'admin.add_doctor' %}active{% endif %}">
                Add Doctor
            </a>
            <a href="{{ url_for('admin.set_appointment') }}"
                class="nav-item {% if request.endpoint == 'admin.set_appointment' %}active{% endif %}">
                Set Appointment
            </a>
            <!-- Add more links as needed, maybe search shortcuts? -->
        </nav>
    </aside>

    <main class="admin-content">
        {% block admin_content %}{% endblock %}
    </main>
</div>
{% endblock %}
