{% extends "admin/admin_base.html" %}

{% block title %}Update Patient - Arogya{% endblock %}

{% block admin_content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="section-header">
    <h2>Update Patient</h2>
  </div>

  <form action="{{ url_for('admin.update_patient', patient_id=patient.patient_id) }}" method="POST" id="update_pat">

    <div class="form-group">
      <label for="pat_name" class="form-label">Name of the Patient</label>
      <input type="text" id="pat_name" name="pat_name" class="form-input" required value="{{ patient.pat_name }}">
    </div>

    <div class="form-group">
      <label class="form-label">Gender</label>
      <div style="display: flex; gap: 1rem;">
        <label style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="radio" name="gender" id="gfemale" value="female" {% if patient and patient.gender=='female'
            %}checked{% endif %}>
          <span>Female</span>
        </label>
        <label style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="radio" name="gender" id="gmale" value="male" {% if patient and patient.gender=='male' %}checked{%
            endif %}>
          <span>Male</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="contact_num" class="form-label">Contact Number</label>
      <input type="tel" id="contact_num" name="contact_num" class="form-input" value="{{ patient.contact_num }}">
    </div>

    <div class="form-group">
      <label for="dob" class="form-label">Date of Birth</label>
      <input type="date" id="dob" name="dob" class="form-input" required value="{{ patient.date }}">
    </div>

    <div class="form-group">
      <label for="age" class="form-label">Age</label>
      <input type="number" id="age" name="age" class="form-input" required value="{{ patient.age }}">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Update Patient</button>
  </form>
</div>
{% endblock %}
