{% extends "admin/admin_base.html" %}

{% block title %}Update Patient - Arogya{% endblock %}

{% block admin_content %}
<div class="flex justify-center items-start min-h-[80vh]">
  
  <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl shadow-xl overflow-hidden">
    
    <div class="p-8 border-b border-gray-800">
      <h2 class="text-2xl font-bold text-white tracking-tight">Update Patient Profile</h2>
      <p class="text-gray-400 text-sm mt-1">Edit the personal details for this patient.</p>
    </div>

    <form action="{{ url_for('admin.update_patient', patient_id=patient.patient_id) }}" method="POST" id="update_pat" class="p-8 space-y-6">

      <div>
        <label for="pat_name" class="block text-sm font-medium text-gray-300 mb-2">Name of the Patient</label>
        <input 
          type="text" 
          id="pat_name" 
          name="pat_name" 
          required 
          value="{{ patient.pat_name }}"
          class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-600 outline-none transition-all"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-3">Gender</label>
        <div class="flex gap-6">
          <label class="flex items-center gap-3 cursor-pointer group">
            <div class="relative flex items-center">
              <input 
                type="radio" 
                name="gender" 
                id="gfemale" 
                value="female" 
                {% if patient and patient.gender=='female' %}checked{% endif %}
                class="peer h-5 w-5 cursor-pointer appearance-none rounded-full border border-gray-600 checked:border-blue-500 checked:bg-blue-600 transition-all"
              >
              <div class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-white opacity-0 peer-checked:opacity-100 transition-opacity"></div>
            </div>
            <span class="text-gray-300 group-hover:text-white transition-colors">Female</span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer group">
             <div class="relative flex items-center">
              <input 
                type="radio" 
                name="gender" 
                id="gmale" 
                value="male" 
                {% if patient and patient.gender=='male' %}checked{% endif %}
