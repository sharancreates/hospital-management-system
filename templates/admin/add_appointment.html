{% extends "admin/admin_base.html" %}

{% block title %}Add Appointment - Arogya{% endblock %}

{% block admin_content %}
<div class="flex justify-center items-start min-h-[80vh]">
  
  <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl shadow-xl overflow-hidden">
    
    <div class="p-8 border-b border-gray-800">
      <h2 class="text-2xl font-bold text-white tracking-tight">Set New Appointment</h2>
      <p class="text-gray-400 text-sm mt-1">Schedule a consultation between a patient and a doctor.</p>
    </div>

    <form action="{{ url_for('admin.set_appointment') }}" method="POST" id="new-app" class="p-8 space-y-6">

      <div>
        <label for="pat" class="block text-sm font-medium text-gray-300 mb-2">Select Patient</label>
        <div class="relative">
          <select 
            id="pat" 
            name="pat" 
            required
            class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none cursor-pointer outline-none transition-all"
          >
            <option value="" selected disabled class="text-gray-500">-- Select Patient --</option>
            {% for pat in patients %}
            <option value="{{ pat.patient_id }}" class="bg-gray-900 py-2">{{ pat.pat_name }}</option>
            {% endfor %}
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <div>
        <label for="doc" class="block text-sm font-medium text-gray-300 mb-2">Select Doctor</label>
        <div class="relative">
          <select 
            id="doc" 
            name="doc" 
            required
            class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none cursor-pointer outline-none transition-all"
          >
            <option value="" selected disabled class="text-gray-500">-- Select Doctor --</option>
            {% for doc in doctors %}
            <option value="{{ doc.doctor_id }}" class="bg-gray-900 py-2">{{ doc.doc_name }}</option>
            {% endfor %}
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="date" class="block text-sm font-medium text-gray-300 mb-2">Date</label>
          <input 
            type="date" 
            id="date" 
            name="date" 
            required
            class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-600 outline-none transition-all [color-scheme:dark]"
          >
        </div>

        <div>
          <label for="time" class="block text-sm font-medium text-gray-300 mb-2">Time</label>
          <input 
            type="time" 
            id="time" 
            name="time" 
            required
            class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-600 outline-none transition-all [color-scheme:dark]"
          >
        </div>
      </div>

      <div class="pt-4">
        <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-500 focus:ring-4 focus:outline-none focus:ring-blue-800 font-bold rounded-lg text-sm px-5 py-3.5 text-center shadow-lg hover:shadow-blue-500/20 transition-all">
          Create Appointment
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
