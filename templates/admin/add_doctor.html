{% extends "admin/admin_base.html" %}

{% block title %}Add Doctor - Arogya{% endblock %}

{% block admin_content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="section-header">
    <h2>Add New Doctor</h2>
  </div>

  <form action="{{ url_for('admin.add_doctor') }}" method="POST" id="new-doc">

    <div class="form-group">
      <label for="doc-name" class="form-label">Name of the Doctor</label>
      <input type="text" id="doc-name" name="doc-name" class="form-input" required placeholder="Dr. Name">
    </div>

    <div class="form-group">
      <label class="form-label">Gender</label>
      <div style="display: flex; gap: 1rem;">
        <label style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="radio" name="gender" id="gfemale" value="female">
          <span>Female</span>
        </label>
        <label style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="radio" name="gender" id="gmale" value="male">
          <span>Male</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="contact_num" class="form-label">Contact Number</label>
      <input type="tel" id="contact_num" name="contact_num" class="form-input" placeholder="+1 234 567 8900">
    </div>

    <div class="form-group">
      <label for="dob" class="form-label">Date of Birth</label>
      <input type="date" id="dob" name="dob" class="form-input" required>
    </div>

    <div class="form-group">
      <label for="specialization" class="form-label">Specialization</label>
      <select id="specialization" name="specialization" class="form-select" required>
        <option selected disabled value="">Select Department</option>
        {% for dept in department %}
        <option value="{{ dept.department_id }}">
          {{ dept.department_name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Add Doctor</button>
  </form>
</div>
{% endblock %}
