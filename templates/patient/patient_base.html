{% extends "base.html" %}

{% block css %}
{% block page_css %}{% endblock %}
{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row min-h-screen bg-gray-950">
    
    <aside class="w-full md:w-64 bg-gray-900 border-r border-gray-800 md:min-h-screen flex-shrink-0">
        
        <div class="p-6 border-b border-gray-800 md:block hidden">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Patient Portal</h2>
        </div>

        <nav class="p-4 space-y-2">
            
            <a href="{{ url_for('patient.patient_dashboard') }}"
               class="flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
               {% if request.endpoint == 'patient.patient_dashboard' %}
                   bg-blue-600/10 text-blue-400 border border-blue-600/20 shadow-sm shadow-blue-900/20
               {% else %}
                   text-gray-400 hover:bg-gray-800 hover:text-white border border-transparent
               {% endif %}">
                <svg class="w-5 h-5 mr-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>

            <a href="{{ url_for('patient.add_appointment') }}"
               class="flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
               {% if request.endpoint == 'patient.add_appointment' %}
                   bg-blue-600/10 text-blue-400 border border-blue-600/20 shadow-sm shadow-blue-900/20
               {% else %}
                   text-gray-400 hover:bg-gray-800 hover:text-white border border-transparent
               {% endif %}">
                <svg class="w-5 h-5 mr-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Book Appointment
            </a>

            {% if patient %} 
            <a href="{{ url_for('patient.update_patient', patient_id=patient.patient_id) }}"
               class="flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
               {% if request.endpoint == 'patient.update_patient' %}
                   bg-blue-600/10 text-blue-400 border border-blue-600/20 shadow-sm shadow-blue-900/20
               {% else %}
                   text-gray-400 hover:bg-gray-800 hover:text-white border border-transparent
               {% endif %}">
                <svg class="w-5 h-5 mr-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                My Profile
            </a>
            {% endif %}

        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-8 overflow-x-hidden">
        {% block patient_content %}{% endblock %}
    </main>
    
</div>
{% endblock %}
