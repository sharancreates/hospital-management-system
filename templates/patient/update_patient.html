{% extends "patient/patient_base.html" %}

{% block title %}Update Profile - Arogya{% endblock %}

{% block patient_content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="section-header">
    <h2>Edit Profile</h2>
  </div>

  <form action="{{ url_for('patient.update_patient', patient_id=patient.patient_id) }}" method="POST"
    id="update-patient">

    <div class="form-group">
      <label for="pat-name" class="form-label">Name</label>
      <input type="text" id="pat-name" name="pat-name" class="form-input" required
        value="{{ patient.pat_name if patient else '' }}">
    </div>

    <div class="form-group">
      <label class="form-label">Gender</label>
      <div style="display: flex; gap: 1rem;">
        <label style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="radio" name="gender" id="gfemale" value="female" {% if patient and patient.gender=='female'
            %}checked{% endif %}>
          <span>Female</span>
        </label>
        <label style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="radio" name="gender" id="gmale" value="male" {% if patient and patient.gender=='male' %}checked{%
            endif %}>
          <span>Male</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="contact_num" class="form-label">Contact Number</label>
      <input type="tel" id="contact_num" name="contact_num" class="form-input"
        value="{{ patient.contact_num if patient else '' }}">
    </div>

    <div class="form-group">
      <label for="dob" class="form-label">Date of Birth</label>
      <input type="date" id="dob" name="dob" class="form-input" required value="{{ patient.dob if patient else '' }}">
    </div>

    <div class="form-group">
      <label for="age" class="form-label">Age</label>
      <input type="number" id="age" name="age" class="form-input" required value="{{ patient.age if patient else '' }}">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Update Changes</button>
  </form>
</div>
{% endblock %}
