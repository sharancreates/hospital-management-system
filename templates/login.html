{% extends "base.html" %}

{% block title %}Sign In - Arogya{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card">
        <div class="login-header">
            <h2>Sign In</h2>
            <p style="color: var(--text-muted);">Welcome back to Arogya</p>
        </div>

        <form class="login-form" action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label for="email" class="form-label">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required class="form-input"
                    placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="form-input" placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                Sign In
            </button>

            <div class="login-footer">
                <p>Or go back to <a href="{{ url_for('index') }}">Home Page</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
