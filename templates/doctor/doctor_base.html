{% extends "base.html" %}

{% block css %}
{% block page_css %}{% endblock %}
{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row min-h-screen bg-gray-950">
    
    <aside class="w-full md:w-64 bg-gray-900 border-r border-gray-800 md:min-h-screen flex-shrink-0">
        
        <div class="p-6 border-b border-gray-800 md:block hidden">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Doctor Portal</h2>
        </div>

        <nav class="p-4 space-y-2">
            
            <a href="{{ url_for('doctor.doctor_dashboard') }}"
               class="flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
               {% if request.endpoint == 'doctor.doctor_dashboard' %}
                   bg-blue-600/10 text-blue-400 border border-blue-600/20 shadow-sm shadow-blue-900/20
               {% else %}
                   text-gray-400 hover:bg-gray-800 hover:text-white border border-transparent
               {% endif %}">
                <svg class="w-5 h-5 mr-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>

            {% if doctor %} 
            <a href="{{ url_for('doctor.set_availability', doctor_id=doctor.doctor_id) }}"
               class="flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200
               {% if request.endpoint == 'doctor.set_availability' %}
                   bg-blue-600/10 text-blue-400 border border-blue-600/20 shadow-sm shadow-blue-900/20
               {% else %}
                   text-gray-400 hover:bg-gray-800 hover:text-white border border-transparent
               {% endif %}">
                <svg class="w-5 h-5 mr-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                My Availability
            </a>
            {% endif %}

        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-8 overflow-x-hidden">
        {% block doctor_content %}{% endblock %}
    </main>
    
</div>
{% endblock %}
