{% extends "doctor/doctor_base.html" %}

{% block title %}Add Treatment - Arogya{% endblock %}

{% block doctor_content %}
<div class="flex justify-center items-start min-h-[80vh]">
  
  <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl shadow-xl overflow-hidden">
    
    <div class="p-8 border-b border-gray-800">
      <h2 class="text-2xl font-bold text-white tracking-tight">Add Treatment Details</h2>
      <p class="text-gray-400 text-sm mt-1">Record diagnosis and prescribe medication.</p>
    </div>

    <div class="px-8 pt-8">
        <div class="bg-gray-950 border border-gray-800 rounded-xl p-5 grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <div class="flex items-center gap-3">
                <div class="p-2 bg-emerald-900/20 text-emerald-400 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Patient</p>
                    <p class="text-sm font-semibold text-white">{{ patient.pat_name }}</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-900/20 text-blue-400 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Date</p>
                    <p class="text-sm font-semibold text-white">{{ app.date }}</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="p-2 bg-purple-900/20 text-purple-400 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Time</p>
                    <p class="text-sm font-semibold text-white">{{ app.time }}</p>
                </div>
            </div>
        </div>
    </div>

    <form action="{{url_for('doctor.add_treatment', appointment_id = app.appointment_id)}}" method="POST" class="p-8 space-y-6">

      <div>
        <label for="ailment" class="block text-sm font-medium text-gray-300 mb-2">Diagnosed Ailment</label>
        <input 
          name="ailment" 
          type="text" 
          id="ailment" 
          required 
          placeholder="e.g. Viral Fever, Migraine, Fracture" 
          class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-600 outline-none transition-all"
        />
      </div>

      <div>
        <label for="prescription" class="block text-sm font-medium text-gray-300 mb-2">Prescription</label>
        <textarea 
          name="prescription" 
          id="prescription" 
          required 
          rows="4" 
          placeholder="List medicines, dosage, and frequency..."
          class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-600 outline-none transition-all resize-y"
        ></textarea>
      </div>

      <div>
        <label for="notes" class="block text-sm font-medium text-gray-300 mb-2">Doctor's Notes</label>
        <textarea 
          name="notes" 
          id="notes" 
          required 
          rows="3" 
          placeholder="Any additional observations or dietary advice..."
          class="w-full bg-gray-950 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-600 outline-none transition-all resize-y"
        ></textarea>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-500 focus:ring-4 focus:outline-none focus:ring-blue-800 font-bold rounded-lg text-sm px-5 py-3.5 text-center shadow-lg hover:shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            Save Treatment Record
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
